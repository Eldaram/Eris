services:
  postgres:
    image: postgres:15-alpine
    container_name: eris-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eris}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: eris-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-eris}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping: 1})' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: eris-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
      - pocketbase_public:/pb_public
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pocketbase-init:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: "no"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-admin@eris.local}
      PB_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-admin_password_123}
    entrypoint: >
      sh -c "pocketbase superuser upsert $$PB_ADMIN_EMAIL $$PB_ADMIN_PASSWORD --dir=/pb_data"
    volumes:
      - pocketbase_data:/pb_data

  backend:
    image: node:20-alpine
    container_name: eris-backend
    restart: unless-stopped
    working_dir: /app/BackEnd
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eris}?schema=public
      - MONGO_URI=mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-rootpassword}@mongodb:27017/${MONGO_DB:-eris}?authSource=admin
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@eris.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-admin_password_123}
      - FRONTEND_URL=http://localhost:5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    command: >
      sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    image: node:20-alpine
    container_name: eris-frontend
    restart: unless-stopped
    working_dir: /app/FrontEnd
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=http://localhost:4000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_started
    command: >
      sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  mongodb_data:
  pocketbase_data:
  pocketbase_public:
